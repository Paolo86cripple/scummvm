name: Repair AGS v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ags-custom
      - name: fix
        run: |
          git config user.name "Paolo86cripple"
          git config user.email "Paolo86cripple@users.noreply.github.com"
          echo  | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          git add -A
          git diff --cached --quiet || (git commit -m "AGS: repair v2 - remove identifier-splitting newlines" && git push origin ags-custom)
