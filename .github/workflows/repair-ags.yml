name: Repair AGS v3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ags-custom
      - name: reset and safe repair
        run: |
          git config user.name "Paolo86cripple"
          git config user.email "Paolo86cripple@users.noreply.github.com"
          git remote add upstream https://github.com/scummvm/scummvm.git
          git fetch upstream master
          git checkout b162f01cbd3ab905026305b01e66891d0f75f1bf -- engines/ags
          echo  | base64 -d > /tmp/fix3.py
          python3 /tmp/fix3.py
          git add -A
          git diff --cached --quiet || (git commit -m "AGS: repair v3 - reset to pre-repair state, aligned-only fix, rebuild module.mk" && git push origin ags-custom)
