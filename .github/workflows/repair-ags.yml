name: Repair AGS files corrupted by write tools
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ags-custom
      - name: Detect and repair inserted newlines
        run: |
          git config user.name "Paolo86cripple"
          git config user.email "Paolo86cripple@users.noreply.github.com"
          python3 - <<'EOF'
          import os, sys
          PERIOD = 2001
          fixed, truncated, skipped = [], [], 0
          for root, dirs, files in os.walk('engines/ags'):
              for fn in files:
                  p = os.path.join(root, fn)
                  try:
                      with open(p, 'rb') as f: data = f.read()
                  except: continue
                  if not data: continue
                  if len(data) >= 32790:
                      truncated.append((p, len(data)))
                  hits = [i for i in range(2000, len(data), PERIOD) if data[i:i+1] == b'\n']
                  if len(hits) >= 3:
                      out = bytearray()
                      for i, b in enumerate(data):
                          if i % PERIOD == 2000 and b == 10:
                              continue
                          out.append(b)
                      with open(p, 'wb') as f: f.write(bytes(out))
                      fixed.append((p, len(hits)))
                  else:
                      skipped += 1
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('## Repair report\n\n')
              s.write('Repaired files: %d\n\n' % len(fixed))
              for p, n in fixed: s.write('- %s: %d inserted newlines removed\n' % (p, n))
              s.write('\nTRUNCATED (unrecoverable): %d\n\n' % len(truncated))
              for p, n in truncated: s.write('- %s: %d bytes\n' % (p, n))
              s.write('\nClean files: %d\n' % skipped)
          print('repaired:', len(fixed), 'truncated:', len(truncated), 'clean:', skipped)
          EOF
          if git diff --quiet; then
            echo "no changes needed"
          else
            git add -A
            git commit -m "AGS: repair files corrupted by API write tool (remove inserted newlines)"
            git push origin ags-custom
          fi
