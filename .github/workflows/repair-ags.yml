name: Repair AGS v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ags-custom
      - name: Remove identifier-splitting newlines
        run: |
          git config user.name "Paolo86cripple"
          git config user.email "Paolo86cripple@users.noreply.github.com"
          python3 <<'EOF'
          import os
          ID = set(bytes(range(48,58))+bytes(range(65,91))+bytes(range(97,123))+b'_')
          fixed, trunc = [], []
          for root, d, fs in os.walk('engines/ags'):
              for fn in fs:
                  p = os.path.join(root, fn)
                  b = open(p, 'rb').read()
                  if len(b) >= 32790:
                      trunc.append((p, len(b)))
                      continue
                  out = bytearray()
                  n = 0
                  for i, c in enumerate(b):
                      if c == 10 and 0 < i < len(b)-1 and b[i-1] in ID and b[i+1] in ID:
                          n += 1
                          continue
                      out.append(c)
                  if n:
                      open(p, 'wb').write(bytes(out))
                      fixed.append((p, n))
          with open('REPAIR_REPORT.txt', 'w') as f:
              f.write('FIXED (file, newlines removed):\n')
              f.write(''.join('%s %d\n' % t for t in fixed))
              f.write('TRUNCATED (irrecoverable, need manual restore):\n')
              f.write(''.join('%s %d\n' % t for t in trunc))
          print('fixed:', len(fixed), 'truncated:', len(trunc))
          EOF
          git add -A
          git diff --cached --quiet || (git commit -m "AGS: repair v2 - remove identifier-splitting newlines" && git push origin ags-custom)
