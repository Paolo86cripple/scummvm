name: Merge upstream master
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream master (upstream wins conflicts)
        run: |
          git config user.name "Paolo86cripple"
          git config user.email "Paolo86cripple@users.noreply.github.com"
          git remote add upstream https://github.com/scummvm/scummvm.git
          git fetch upstream master
          if git merge upstream/master; then
            echo "merge completato senza conflitti"
          else
            echo "conflitti, risolvo prendendo la versione upstream"
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            git commit --no-edit
          fi
          git push origin master
