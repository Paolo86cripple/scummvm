name: Create ags-custom branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push ags-custom branch at pre-corruption AGS commit
        run: |
          SHA=b162f01cbd3ab905026305b01e66891d0f75f1bf
          if git ls-remote --exit-code origin refs/heads/ags-custom; then
            echo "branch ags-custom esiste gia"
          else
            git push origin "$SHA":refs/heads/ags-custom
            echo "branch creato"
          fi
