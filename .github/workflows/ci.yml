name: Hollywood builds

on:
  push:
    branches:
      - dev-hollywood-builds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hollywood-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (Hollywood only)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libsdl2-dev zlib1g-dev libpng-dev
      - name: Configure Hollywood only
        run: |
          mkdir build-scummvm
          cd build-scummvm
          ../configure --disable-all-engines --enable-engine=hollywood --disable-detection-full \
            --enable-release --disable-debug --enable-zlib --enable-png \
            --disable-mad --disable-fribidi --disable-ogg --disable-vorbis --disable-flac \
            --disable-mpeg2 --disable-theoradec --disable-freetype2 --disable-jpeg --disable-faad --disable-a52 \
            --disable-libcurl --disable-sdlnet --disable-tts --disable-libunity --disable-gtk \
            --disable-alsa --disable-sndio
          test "$(sed -n 's/^ENABLE_\([A-Z0-9_]*\) = .*PLUGIN$/\1/p' config.mk)" = HOLLYWOOD
          ! grep -q '^DETECTION_FULL = 1' config.mk
      - name: Build ScummVM
        working-directory: build-scummvm
        run: make -j2 scummvm
      - name: Package executable
        run: |
          strip build-scummvm/scummvm
          mkdir -p package/licenses
          cp build-scummvm/scummvm COPYING COPYRIGHT .github/hollywood/README.md package/
          cp LICENSES/* package/licenses/
          tar -czf scummvm-hollywood-linux-x86_64.tar.gz -C package .
      - name: Upload Linux download
        uses: actions/upload-artifact@v7
        with:
          name: scummvm-hollywood-linux-x86_64
          path: scummvm-hollywood-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

  win32:
    name: Windows x86 (Hollywood only)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows-static
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@v7
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d # 2026.07.29
          path: vcpkg
      - name: Set up vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./vcpkg/vcpkg.exe integrate install
      - name: Build project generator
        run: |
          cmake -S devtools/create_project/cmake -B build-create-project -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-create-project --config Release --parallel 2
      - name: Configure Hollywood only
        run: |
          New-Item -ItemType Directory build-scummvm
          Copy-Item .github/hollywood/vcpkg.json, .github/hollywood/Directory.Build.targets build-scummvm/
          $configureArgs = @(
            ".", "--output-dir", "build-scummvm", "--file-prefix", "..", "--msvc", "--msvc-version", "17", "--vcpkg",
            "--disable-all-engines", "--enable-engine=hollywood", "--disable-detection-full",
            "--use-windows-subsystem", "--disable-nasm", "--disable-tts",
            "--disable-mad", "--disable-fribidi", "--disable-ogg", "--disable-vorbis", "--disable-flac",
            "--disable-mpeg2", "--disable-theoradec", "--disable-freetype2", "--disable-jpeg",
            "--disable-libcurl", "--disable-sdlnet"
          )
          ./build-create-project/Release/create_project.exe @configureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $props = Get-Content build-scummvm/ScummVM_Globalx86.props -Raw
          $engines = [regex]::Matches($props, '\bENABLE_[A-Z0-9_]+\b') | ForEach-Object { $_.Value } | Sort-Object -Unique
          if (($engines -join ",") -ne "ENABLE_HOLLYWOOD" -or $props.Contains("DETECTION_FULL")) {
            throw "Expected only the Hollywood engine and detector"
          }
      - name: Install static libraries
        run: ./vcpkg/vcpkg.exe install --triplet x86-windows-static --x-manifest-root=build-scummvm
      - uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
      - name: Build ScummVM
        working-directory: build-scummvm
        run: |
          $buildArgs = @(
            "scummvm.sln", "/m:2", "/v:minimal", "/p:Configuration=Release", "/p:Platform=Win32",
            "/p:PreferredToolArchitecture=x64", "/p:VcpkgTriplet=x86-windows-static",
            "/p:VcpkgEnableManifest=true", "/p:VcpkgManifestInstall=false"
          )
          msbuild @buildArgs
      - name: Package executable
        run: |
          New-Item -ItemType Directory -Force package/licenses
          Copy-Item build-scummvm/Releasex86/scummvm.exe, COPYING, COPYRIGHT, .github/hollywood/README.md package/
          Copy-Item LICENSES/* package/licenses/
          foreach ($port in "sdl2", "zlib", "libpng") {
            Copy-Item "build-scummvm/vcpkg_installed/x86-windows-static/share/$port/copyright" "package/licenses/$port.txt"
          }
      - name: Upload Win32 download
        uses: actions/upload-artifact@v7
        with:
          name: scummvm-hollywood-win32
          path: package/
          if-no-files-found: error
          retention-days: 30
