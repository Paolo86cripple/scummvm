name: Build AGS engine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ags-custom
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libfreetype-dev libpng-dev zlib1g-dev libtheora-dev libvorbis-dev libogg-dev libfluidsynth-dev
      - name: configure
        run: ./configure --enable-engine=ags
      - name: build
        run: make -j2
